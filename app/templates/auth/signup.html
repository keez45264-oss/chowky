{% extends "base.html" %}
{% block title %}Sign up — Chowky{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Join Chowky</h2>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Pseudonym</label>
                <input type="text" name="pseudonym" class="form-control" placeholder="What others will see you as" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>
        <p class="mt-3">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
