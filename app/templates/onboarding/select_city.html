{% extends "base.html" %}
{% block title %}Pick your city — Chowky{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-2">Where are you?</h2>
        <p class="text-muted mb-4">Pick your city to enter its zone.</p>
        <form method="post">
            <div class="list-group mb-4">
                {% for city in cities %}
                <label class="list-group-item d-flex align-items-center gap-2">
                    <input class="form-check-input mt-0" type="radio" name="city_id" value="{{ city['id'] }}" required>
                    <span>{{ city['name'] }}{% if city['state'] %} <small class="text-muted">({{ city['state'] }})</small>{% endif %}</span>
                </label>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-primary w-100">Continue</button>
        </form>
    </div>
</div>
{% endblock %}
